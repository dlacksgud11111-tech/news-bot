name: news-bot-messages

# 내가 봇에게 보낸 링크·명령어에만 응답하는 가벼운 실행.
#
#  왜 따로 두는가
#    bot.yml 은 피드 19개에서 기사 1,100여 건을 긁느라 회당 30초가 걸립니다.
#    그걸 1분마다 돌리는 것은 낭비라서, 메시지만 보는 실행을 따로 뒀습니다
#    (--messages-only: 뉴스 수집·발행·주간 리포트를 전부 건너뜁니다).
#
#  누가 깨우는가
#    구글 앱스 스크립트가 1분마다 깨웁니다 (apps-script/wake-news-bot-messages.gs).
#    GitHub 자체 예약(cron)은 쓰지 않습니다 — 2026-09-18 실측으로 30분 간격
#    예약이 하루 세 번만 실행됐고, 그 사이에 보낸 링크는 답을 못 받았습니다.
#    그 실패를 반복하지 않으려고 예약을 아예 걸지 않았습니다.
#
#  이게 죽으면
#    bot.yml 이 --messages-if-stale 20 으로 돕니다. 이 워크플로가 20분 넘게
#    조용하면 5분짜리 실행이 메시지를 대신 처리합니다. 응답은 느려지지만
#    아예 끊기지는 않습니다.
#
#  ⚠️ public 저장소 전용입니다. 1분마다 돌면 하루 약 1,440회이고,
#     private 으로 바꾸면 무료 한도(월 2,000분)를 이틀이면 씁니다.

on:
  workflow_dispatch:

permissions:
  contents: write           # state/state.json (텔레그램 오프셋) 저장

concurrency:
  group: news-bot-messages
  cancel-in-progress: false # 겹치면 앞 실행이 끝날 때까지 기다린다.
                            # 두 실행이 동시에 텔레그램을 읽으면 같은 링크에
                            # 두 번 답하거나 409 가 난다.

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Handle messages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SUMMARY: ${{ secrets.TELEGRAM_CHAT_ID_SUMMARY }}
        run: python src/main.py --messages-only

      - name: Persist state
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "상태 변화 없음"
            exit 0
          fi
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          echo "::warning::상태 저장 실패 — 같은 링크에 두 번 답할 수 있음"
