name: news-bot-worker

# 링크를 던지면 몇 초 안에 답이 오게 하는 "상시 대기" 워커.
#
#  - 30분마다 시작해 50분간 15초 간격으로 텔레그램을 확인합니다.
#    앞 실행이 아직 돌고 있어도 새 실행이 이어받으므로(cancel-in-progress),
#    GitHub 예약이 밀려도 끊기지 않습니다.
#  - 수신 메시지는 이 워커가 전담합니다. bot.yml 은 --no-messages 로 돌아서
#    같은 메시지에 두 번 답하는 일이 없습니다.
#  - 뉴스 자동 수집은 하지 않습니다(--messages-only). 그건 bot.yml 담당.
#  - 상태 파일을 커밋하지 않습니다. 텔레그램이 확인된 메시지를 서버에서 지우므로
#    오프셋을 저장할 필요가 없습니다.
#
#  ⚠️ public 저장소 전용 설정입니다. private 으로 바꾸면 월 2,000분 무료 한도를
#     하루 만에 다 씁니다. 그때는 아래 schedule 을 지우고 수동 실행만 쓰세요.
#     실행 시간을 줄이려면 cron 의 시간대를 좁히세요.
#     예) "0,30 22-23,0-16 * * *" = 한국시간 07시~새벽 01시만

on:
  workflow_dispatch:
  schedule:
    - cron: "0,30 * * * *"

permissions:
  contents: read

concurrency:
  group: news-bot-worker
  cancel-in-progress: true

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Listen for 50 minutes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          end=$(( $(date +%s) + 3000 ))
          while [[ $(date +%s) -lt $end ]]; do
            python src/main.py --messages-only || echo "::warning::iteration failed"
            sleep 15
          done
