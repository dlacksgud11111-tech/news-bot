name: news-bot

on:
  schedule:
    # GitHub Actions cron 은 5분이 최소 간격이고, 혼잡하면 5~15분 지연될 수 있습니다.
    - cron: "*/5 * * * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write           # state/state.json 을 다시 커밋하기 위해 필요

concurrency:
  group: news-bot
  cancel-in-progress: false # 실행이 겹쳐서 상태 파일이 꼬이는 것을 막음

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 채널 주소. 시크릿이 없으면 빈 값이 들어오고, 코드가 개인 DM 으로
          # 떨어뜨립니다 (config.yaml 의 channels 참고). 이걸 안 넘기면
          # 채널을 만들어 놨어도 GitHub 에서 돌 때는 전부 DM 으로만 갑니다.
          TELEGRAM_CHAT_ID_ALERT: ${{ secrets.TELEGRAM_CHAT_ID_ALERT }}
          TELEGRAM_CHAT_ID_CLIP: ${{ secrets.TELEGRAM_CHAT_ID_CLIP }}
          TELEGRAM_CHAT_ID_WEEKLY: ${{ secrets.TELEGRAM_CHAT_ID_WEEKLY }}
          TELEGRAM_CHAT_ID_SUMMARY: ${{ secrets.TELEGRAM_CHAT_ID_SUMMARY }}
        # 이 단계가 뉴스 수집과 수신 메시지를 함께 처리합니다.
        # 이어지는 'Listen for messages' 단계와 한 짝입니다.
        run: python src/main.py

      # 앱스 스크립트가 5분마다 깨우니, 한 실행이 4분을 버티면 사실상 언제나
      # 누군가 듣고 있는 셈이 됩니다. 링크를 넣으면 10초 안팎에 답이 옵니다.
      #
      # 별도 워크플로를 두지 않는 이유: 그러면 그쪽을 깨울 트리거가 또 필요한데,
      # GitHub 예약에 맡겼다가 하루 세 번만 살아남은 것이 예전 worker.yml 입니다.
      # 이미 제 시각에 오는 트리거에 얹는 편이 확실하고, 앱스 스크립트는
      # 손댈 필요가 없습니다.
      #
      # 240초인 이유: 앞 단계가 30초쯤 걸려 합쳐서 4분 반이고, 다음 5분 깨우기와
      # 겹치지 않습니다. 겹치더라도 concurrency 가 줄을 세웁니다.
      - name: Listen for messages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SUMMARY: ${{ secrets.TELEGRAM_CHAT_ID_SUMMARY }}
        run: |
          end=$(( $(date +%s) + 240 ))
          while [[ $(date +%s) -lt $end ]]; do
            sleep 10
            python src/main.py --messages-only || echo "::warning::메시지 처리 실패"
          done

      - name: Persist state
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "상태 변화 없음"
            exit 0
          fi
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          echo "::warning::상태 저장 실패 — 다음 실행에서 일부 기사가 중복될 수 있음"
