name: news-bot

on:
  schedule:
    # GitHub Actions cron 은 5분이 최소 간격이고, 혼잡하면 5~15분 지연될 수 있습니다.
    - cron: "*/5 * * * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write           # state/state.json 을 다시 커밋하기 위해 필요

concurrency:
  group: news-bot
  cancel-in-progress: false # 실행이 겹쳐서 상태 파일이 꼬이는 것을 막음

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py

      - name: Persist state
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "상태 변화 없음"
            exit 0
          fi
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          echo "::warning::상태 저장 실패 — 다음 실행에서 일부 기사가 중복될 수 있음"
