# 구글 뉴스 RSS 검색 (직접 피드가 없는 소스까지 긁어옴)
google_news:
  - { q: "변압기 OR 전력기기 OR 송전망 수주", hl: ko, gl: KR, ceid: "KR:ko" }
  - { q: "HD현대일렉트릭 OR 효성중공업 OR LS일렉트릭", hl: ko, gl: KR, ceid: "KR:ko" }
  - { q: "데이터센터 전력 OR 전력수급기본계획 OR 계통연계", hl: ko, gl: KR, ceid: "KR:ko" }
  - { q: "transformer shortage OR transformer order OR switchgear backlog", hl: en-US, gl: US, ceid: "US:en" }
  - { q: "transmission line project OR HVDC contract OR grid interconnection queue", hl: en-US, gl: US, ceid: "US:en" }
  - { q: "data center power demand OR utility capex OR FERC order", hl: en-US, gl: US, ceid: "US:en" }

