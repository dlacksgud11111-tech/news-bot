# ============================================================
#  전력·에너지 뉴스 봇 설정
#  이 파일만 고치면 봇의 성격이 바뀝니다. 코드는 건드릴 필요 없음.
# ============================================================

model:
  # 요약에 쓰는 모델.
  #   claude-sonnet-5  입력 $2  / 출력 $10  per 1M  ← 현재 설정
  #   claude-opus-5    입력 $5  / 출력 $25  per 1M  (품질 최상, 약 2.5배 비쌈)
  # 기사 요약은 판단보다 정리에 가까워서 sonnet 으로도 충분합니다.
  # 요약이 부실하다 싶으면 opus 로 되돌리세요.
  id: claude-sonnet-5
  # low | medium | high | xhigh | max  — 뉴스 요약은 low 로 충분하고 가장 쌉니다.
  effort: low
  max_tokens: 8000

  # 내가 직접 링크를 보낸 경우에만 쓰는 설정.
  # 자동 수집분은 '정리'라서 sonnet·low 로 충분한데, 직접 고른 기사는
  # '이 법안이 통과되면 누가 왜 수혜인가'까지 추론해야 합니다. 같은 설정으로는
  # 주가·거래량만 옮기고 멈춥니다. 하루 몇 건이라 비용 차이는 작습니다(건당 수십원).
  # 되돌리려면 이 세 줄을 지우면 위 설정을 그대로 씁니다.
  ondemand:
    id: claude-opus-5
    effort: medium

# news-clipper 가 매일 07시에 4개 섹터 32건을 통독용으로 보내줍니다.
# 이 봇은 "아침까지 기다리면 늦는 것"만 담당하므로 문턱이 높게 잡혀 있습니다.
# 뉴스가 너무 안 온다 싶으면 min_importance 를 3으로, min_score 를 5로 내리세요.
limits:
  max_posts_per_run: 2      # 한 번 돌 때 최대 발행 수 (도배 방지)
  max_posts_per_day: 4      # 하루 총 상한. 통독은 아침 다이제스트가 하므로 적게 잡음
  max_night_queue: 2        # 조용한 시간에 쌓을 수 있는 최대 건수.
                            # 미국 뉴스가 새벽에 몰려 하루치를 다 먹어버리는 것을 막는다.
  max_per_company_per_day: 1  # 같은 회사 건은 하루 몇 건까지. 0 이면 제한 없음.
                            # 대형 수주는 공시가 쪼개져 나와(2200억 + 1665억 = 3865억)
                            # 숫자 지문만으로는 같은 사건인 줄 모른다. 이 규칙이 그걸 막는다.
  max_candidates_per_run: 15  # 점수 통과 후 모델까지 보낼 기사 수 상한 (비용 상한)
  min_importance: 4         # 모델이 매긴 중요도(1~5)가 이 값 미만이면 발행 안 함
  min_score: 7              # 키워드 점수가 이 값 미만이면 모델에 보내지도 않음
  article_max_chars: 12000  # 모델에 넣는 본문 최대 길이

quiet_hours:
  # 한국시간 기준. 수집은 계속하고 발송만 멈춥니다.
  # 새벽에 쌓인 클리핑은 아침 첫 실행 때 한 번에 나갑니다 — 아침 다이제스트와 같은 효과.
  enabled: true
  start: 1   # 01시부터
  end: 7     # 07시 전까지 조용
  # 어느 모드에 적용할지. 새벽에도 즉시 알림을 받고 싶으면 alert 를 빼세요.
  # 알람은 버퍼가 없지만, 조용한 시간에는 아예 건드리지 않고 넘기므로
  # 아침 첫 실행 때 그 기사들이 그대로 후보에 남아 한꺼번에 나갑니다.
  applies_to: [clip, alert]

# ============================================================
#  채널 배정 — 값은 GitHub Secrets / .env 의 환경변수 이름입니다.
#  비어 있으면 개인 DM(TELEGRAM_CHAT_ID)으로 떨어집니다.
# ============================================================
#  하나의 업무 = 하나의 채널. 개인 DM 은 '링크를 넣는 입력창'과 명령어 응답으로만
#  씁니다. 채널 주소가 비어 있으면 그 메시지는 DM 으로 떨어집니다.
channels:
  alert: TELEGRAM_CHAT_ID_ALERT       # ⚡️ 전력 알람 — 키워드 즉시
  clip: TELEGRAM_CHAT_ID_CLIP         # 📰 시간별 뉴스 클리핑 — 2시간마다 목록
  weekly: TELEGRAM_CHAT_ID_WEEKLY     # 📋 부동산 위클리 — 금요일 08시 News Flow
  summary: TELEGRAM_CHAT_ID_SUMMARY   # 📝 기사 요약 — DM 에 링크를 넣으면 여기로

# ============================================================
#  1) 키워드 알람 — AI를 쓰지 않습니다. 제목만 보고 즉시 보냅니다.
#
#  require_company: true  → 워치리스트 회사명이 제목에 함께 있어야 울립니다.
#    '수주' 하나로 울리면 하루 수십 건이 옵니다. 회사와 사건을 곱해야
#    "무슨 일이 실제로 벌어졌다"에 가까워집니다.
#  알람이 너무 적으면 words 를 늘리고, 너무 많으면 require_company 를 켜세요.
# ============================================================
alerts:
  enabled: true
  max_per_run: 5
  max_per_day: 30
  cooldown_hours: 4      # 같은 회사의 같은 유형 사건은 이 시간 안에 한 번만.
                         # 큰 수주는 매체 열 곳이 제목을 달리해 쓰는데, 제목만으로는
                         # 같은 사건인 줄 모른다. 이 값이 그 재탕을 막는다.
  rules:
    - name: 수주·계약
      require_company: true
      words: [수주, 공급계약, 공급 계약, 계약 체결, 계약체결, 낙찰, 우선협상, 선정,
              order, contract, awarded, wins]

    - name: 투자·증설
      require_company: true
      words: [증설, 신설, 착공, 신규 공장, 공장 설립, 인수, 합작, 지분 취득,
              투자 확대, capex, expansion, acquire, joint venture]

    - name: 실적·공시
      require_company: true
      words: [공시, 수주잔고, 영업이익, 잠정실적, 유상증자, 회사채]

    - name: 통상·정책
      require_company: false
      words: [반덤핑, 상계관세, 세이프가드, 수입규제, 관세 부과, 무역위원회,
              전력수급기본계획, 전기요금 인상, 계통연계 제도, 송전망 계획,
              FERC, tariff ruling, anti-dumping]

    - name: 대형 프로젝트
      require_company: false
      # '착수'·'준공'은 어느 분야에나 쓰여서 뺐습니다(제물포역 도시재생 준공까지 울림).
      words: [조원 규모, 억달러 규모, 조 원 규모, 최종 승인,
              우선협상대상자, 국가기간 전력망, 예비타당성, 전력계통 영향평가]

# ============================================================
#  2) 클리핑 — 훑어보기용. 역시 AI를 쓰지 않습니다.
#     매 실행마다 버퍼에 쌓고, interval_hours 마다 한 번에 보냅니다.
# ============================================================
clipping:
  enabled: true
  interval_hours: 2      # 몇 시간마다 묶어 보낼지
  max_items: 40          # 한 번에 보낼 최대 건수. 훑을 수 있는 분량으로 잡으세요.
  max_per_sector: 8      # 섹터 하나가 목록을 독차지하지 않게 하는 상한
  max_per_company: 3     # 같은 회사 기사가 한 섹터에서 차지할 수 있는 최대 줄 수
  buffer_cap: 300        # 내부 버퍼 상한 (폭주 방지)
  min_items: 3           # 이보다 적으면 다음 회차로 미룹니다

# ============================================================
#  3) AI 선별 발행 — 기본 꺼짐.
#     알람과 클리핑이 생기면서 역할이 겹칩니다. AI 판단은 이제
#     "내가 링크를 보냈을 때"만 씁니다. 되살리려면 true 로 바꾸세요.
# ============================================================
curation:
  enabled: false

# ============================================================
#  4) 부동산 주간 News Flow — 금요일 오전에 한 번.
#     LS증권 '부동산 Weekly Data' 의 '지난주 주요 News Flow' 칸에 그대로 붙일
#     8건을 뽑아 클리핑 채널(일일 클리핑 오는 곳)로 보냅니다.
#     대상 기간은 지난주 금요일 00:00 ~ 이번주 금요일 08:00 (KST).
#     위 알람·클리핑과 소스가 완전히 따로입니다 (전력 피드를 쓰지 않습니다).
# ============================================================
weekly:
  enabled: true
  channel: weekly      # 위 channels 중 어디로 보낼지
  weekday: 5           # ISO 요일. 1=월 … 7=일 → 5는 금요일
  hour: 8              # 이 시각이 지난 첫 실행에 나갑니다 (5분마다 도니 오차 5분)
  count: 8             # 최종 선정 건수
  per_outlet: 2        # 한 매체에서 최대 몇 건까지
  same_issue: 0.3      # 제목 겹침이 이 값 이상이면 같은 이슈로 봅니다(0~1).
                       # 올리면 비슷한 기사가 여러 건 들어오고, 내리면 더 엄격해집니다.
  alternates: 12       # 8건 중 4건을 직접 바꿔 끼울 때 볼 예비 후보 수
  alt_per_cat: 3       # 예비 후보에서 한 카테고리가 차지할 수 있는 최대 줄 수
  per_subject: 1       # 제목 맨 앞 주체(사람·회사·부처)가 같은 기사는 몇 건까지.
                       # 인사청문회 발언이 매체마다 다른 대목으로 뽑혀 8칸을
                       # 잠식하는 것을 막습니다. 큰 값으로 풀 수 있습니다.

  # 위 규칙에서 빼는 주체. 제목 수백 개가 같이 쓰는 일반 명사라, 한 건으로 묶으면
  # '서울 전셋값' 기사가 '서울 집값' 기사 때문에 빠집니다.
  generic_subjects:
    [서울, 수도권, 전국, 경기, 인천, 지방, 강남, 강남권, 지역, 올해, 내년, 정부,
     국토부, 아파트, 집값, 전셋값, 월세, 전세, 분양, 청약, 주담대, 미분양, 재건축,
     재개발, 대출, 부동산, 주택, 다음, 이번, 내달, 추석]
  window_days: 14      # 구글 뉴스에 요청할 기간. 넉넉히 받아 pubDate 로 다시 거릅니다
  resolve_links: true  # 구글 경유 주소를 언론사 원문 주소로 펴기 (리포트에 필요)
  allow_unlisted: false  # 아래 outlets 목록에 없는 매체도 넣을지

  # 검색어. 하나당 구글 뉴스 100건까지 옵니다. 늘리면 후보가 늘고 실행이 길어집니다.
  queries:
    - 아파트값
    - 집값
    - 전셋값
    - 월세
    - 임대차
    - 전월세 대책
    - 부동산 대책
    - 부동산 정책
    - 주담대
    - 미분양
    - 부동산 세제
    - 재건축 수주
    - 재개발
    - 정비사업
    - 주택 공급

  # 선정 기준. 위에 적힌 카테고리가 우선이고, 카테고리마다 대표 1건을 먼저
  # 확보한 뒤 남은 자리를 점수순으로 채웁니다. 그래서 가격동향은 항상 1건 이상
  # 들어가고, 점수가 높은 정책 기사가 8칸을 다 먹는 일이 없습니다.
  #   weight — 기본 점수 (여기에 '같은 이슈를 쓴 매체 수 × 1.5' 가 더해집니다)
  #   cap    — 이 카테고리에서 최대 몇 건까지
  categories:
    - name: 가격동향
      weight: 5
      cap: 1              # 1단계에서 대표 1건을 먼저 확보하므로, 항상 정확히 1건
      words: [아파트값, 집값, 매매가, 전셋값, 상승폭, 하락 전환, 상승 전환, 연속 상승,
              주간, 부동산원, KB, 신고가, 급매, 낙폭, 하락폭, 매매가격지수]

    - name: 정책
      weight: 4
      cap: 3
      words: [대출 규제, 대출규제, DSR, LTV, 세제, 종부세, 양도세, 보유세, 취득세,
              장특, 대책, 규제지역, 토허, 토지거래허가, 법안, 개정안, 시행,
              국토부, 공급 대책, 공급대책, 주택 공급, 주택공급, 공급 계획, 공급계획,
              청약 제도, 청약제도, 기재부, 금융위]

    - name: 시장지표
      weight: 3
      cap: 2
      words: [거래량, 거래 건수, 미분양, 경쟁률, 가계대출, 주담대, 주택담보대출, 금리,
              입주율, 분양가, 생애최초, 매수세, 매수심리, 경매, 낙찰가율, 청약]

    - name: 전월세
      weight: 3
      cap: 3
      words: [전세, 월세, 전월세, 임대차, 세입자, 보증금, 갱신권, 계약갱신,
              역전세, 반전세, 임대료, 전세난]

    - name: 수주·정비
      weight: 2
      cap: 2             # 건설사 수주·재개발·재건축은 2건 이내 (인수인계 기준)
      words: [수주, 재건축, 재개발, 정비사업, 시공사, 시공권, 조합, 관리처분, 이주비,
              리모델링, 도시정비]

  # 이 매체 기사는 점수를 0.5 얹어줍니다. 리포트에 쓰기 좋은 곳들.
  priority: [한국경제, 매일경제, 서울경제, 연합뉴스, 뉴시스, 헤럴드경제, 조선일보, 중앙일보]

  # 도메인 -> 리포트에 적을 매체명. 여기 없는 매체는 후보에서 빠집니다
  # (allow_unlisted: true 로 바꾸면 구글이 준 이름 그대로 넣습니다).
  outlets:
    hankyung.com: 한국경제
    mk.co.kr: 매일경제
    sedaily.com: 서울경제
    yna.co.kr: 연합뉴스
    newsis.com: 뉴시스
    heraldcorp.com: 헤럴드경제
    biz.chosun.com: 조선비즈
    chosun.com: 조선일보
    joongang.co.kr: 중앙일보
    mt.co.kr: 머니투데이
    fnnews.com: 파이낸셜뉴스
    edaily.co.kr: 이데일리
    news1.kr: 뉴스1
    asiae.co.kr: 아시아경제
    kmib.co.kr: 국민일보
    donga.com: 동아일보
    hankookilbo.com: 한국일보
    seoul.co.kr: 서울신문
    munhwa.com: 문화일보
    segye.com: 세계일보
    khan.co.kr: 경향신문
    hani.co.kr: 한겨레
    etoday.co.kr: 이투데이
    newspim.com: 뉴스핌
    ajunews.com: 아주경제
    bizwatch.co.kr: 비즈워치
    dt.co.kr: 디지털타임스
    yonhapnewstv.co.kr: 연합뉴스TV
    ytn.co.kr: YTN
    sbs.co.kr: SBS
    imbc.com: MBC
    kbs.co.kr: KBS
    mbn.co.kr: MBN
    nocutnews.co.kr: 노컷뉴스

  # 제목에 이게 들어 있으면 버립니다. 정치 공방·사설·칼럼·인터뷰·분양 홍보·단신 제외.
  exclude:
    - 견본주택
    - 모델하우스
    - 분양 예정
    - 분양 나서
    - 개관
    - 사설
    - 칼럼
    - 기고
    - 인터뷰
    - 기자의 눈
    - 기자수첩
    - 취재파일
    - 데스크
    - 시론
    - 논설
    - "[포토]"
    - "[영상]"
    - "[인사]"
    - "[부고]"
